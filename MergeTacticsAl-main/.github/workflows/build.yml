name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle -p MergeTacticsAI assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MergeTacticsAl-APK
          path: MergeTacticsAI/app/build/outputs/apk/debug/*.apk
